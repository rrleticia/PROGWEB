<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Painel de Temperaturas Semanais</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Monitor de Temperaturas Semanais</h2>

    <label for="temperatura">Digite a temperatura (°C):</label><br />
    <input type="number" id="temperatura" step="0.1" />
    <button onclick="adicionarTemperatura()">Adicionar Temperatura</button
    ><br />

    <h3>Temperaturas Inseridas:</h3>
    <ul id="listaTemperaturas"></ul>

    <button onclick="calcularMedia()">Calcular Média</button>
    <button onclick="calcularMediaMovel()">Calcular Média Móvel</button>

    <div id="resultado"></div>

    <script>
      const temperaturas = [];

      function adicionarTemperatura() {
        const input = document.getElementById("temperatura");
        const valor = parseFloat(input.value);

        if (isNaN(valor)) {
          alert("Por favor, insira um número válido.");
          return;
        }

        temperaturas.push(valor);
        detectaTendencia();
        alertaTemperaturaExtrema();

        const lista = document.getElementById("listaTemperaturas");
        const item = document.createElement("li");
        item.textContent = valor + " °C";
        lista.appendChild(item);

        input.value = "";
        input.focus();
      }

      function calcularMedia() {
        if (temperaturas.length === 0) {
          alert("Nenhuma temperatura foi inserida.");
          return;
        }

        const soma = temperaturas.reduce((acum, num) => acum + num, 0);
        const media = soma / temperaturas.length;

        let mensagem;
        if (media > 30) {
          mensagem = "A semana está quente! 🔥";
        } else if (media >= 20 && media <= 30) {
          mensagem = "Temperatura amena. 🌤️";
        } else {
          mensagem = "Semana fria! ❄️";
        }

        const resultado = document.getElementById("resultado");
        resultado.innerHTML = `
          <p>Média das temperaturas: <strong>${media.toFixed(2)} °C</strong></p>
          <div class="alerta">${mensagem}</div>
        `;
      }

      function calcularMediaMovel() {
        if (temperaturas.length === 0) {
          alert("Nenhuma temperatura foi inserida.");
          return;
        }

        const indexMoveis = [];
        for (let i = 2; i < temperaturas.length; i += 3) {
          indexMoveis.push(i);
        }

        const temperaturasMoveis = temperaturas.filter((_, index) =>
          indexMoveis.includes(index)
        );

        const soma = temperaturasMoveis.reduce((acum, num) => acum + num, 0);
        const media = soma / temperaturasMoveis.length;

        let mensagem;
        if (media > 30) {
          mensagem = "A média móvel está quente! 🔥";
        } else if (media >= 20 && media <= 30) {
          mensagem = "Média móvel amena. 🌤️";
        } else {
          mensagem = "Média móvel fria! ❄️";
        }

        const resultado = document.getElementById("resultado");
        resultado.innerHTML = `
          <p>Média móvel das temperaturas: <strong>${media.toFixed(
            2
          )} °C</strong></p>
          <div class="alerta">${mensagem}</div>
        `;
      }

      function detectaTendencia() {
        if (temperaturas.length < 7) {
          return;
        }

        const semana = temperaturas.slice(-7);
        let primeiroDia = semana[0];
        const total = semana.length - 1;

        let diasCrescente = 0;
        let diasDecrescente = 0;

        for (let i = 1; i < semana.length; i++) {
          if (semana[i] > primeiroDia) {
            diasCrescente++;
          } else if (semana[i] < primeiroDia) {
            diasDecrescente++;
          }
          primeiroDia = semana[i];
        }

        if (diasCrescente === total) {
          alert("Tendência de temperatura crescente! Cuidado com o calor >w<");
        } else if (diasDecrescente === total) {
          alert("Tendência de temperatura decrescente! Agasalhe-se bem uwu!");
        } else {
          alert("Tendência de temperatura instável! Preste atenção ein ._.!");
        }
      }

      function alertaTemperaturaExtrema() {
        if (temperaturas.length < 3) {
          return;
        }

        let consecutivosQuentes = 0;
        let consecutivosFrios = 0;

        for (let temp of temperaturas) {
          if (temp > 35) {
            consecutivosQuentes++;
            consecutivosFrios = 0;
          } else if (temp < 5) {
            consecutivosFrios++;
            consecutivosQuentes = 0;
          } else {
            consecutivosQuentes = 0;
            consecutivosFrios = 0;
          }

          if (consecutivosQuentes >= 3) {
            alert(
              "⚠️ Alerta de calor extremo! 3 dias consecutivos acima de 35°C."
            );
            break;
          }

          if (consecutivosFrios >= 3) {
            alert(
              "⚠️ Alerta de frio extremo! 3 dias consecutivos abaixo de 5°C."
            );
            break;
          }
        }
      }
    </script>
  </body>
</html>
