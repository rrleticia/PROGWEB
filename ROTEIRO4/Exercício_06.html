<!DOCTYPE html>
<html>
  <head>
    <title>Exercício 06</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      function ordenarLista() {
        var numeros = document.getElementById("txtNumeros").value;
        numeros = numeros.split(",");
        numeros = numeros.map((num) => parseInt(num));
        numeros.sort();
        document.write("Lista ordernada: " + numeros.toString());
      }
    </script>
  </head>

  <body>
    Números: <input type="text" id="txtNumeros" />
    <input type="button" value="Ordenar lista" onclick="ordenarLista()" />
  </body>
</html>
